<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameAcc Store - ร้านขายไอดีเกม</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-extrabold text-yellow-400 flex items-center gap-2">
                🎮 GameAcc Store
            </h1>
            <div class="bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-700 text-xs md:text-sm">
                <span>ผู้ใช้: <strong id="username" class="text-blue-400">กำลังโหลด...</strong></span>
                <span class="mx-2 text-gray-500">|</span>
                <span>เครดิต: <strong id="userBalance" class="text-green-400">0.00</strong> ฿</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- ฝั่งซ้าย: ตลาดไอดีเกม -->
        <section class="md:col-span-2">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-yellow-400">
                🔥 ไอดีเกมที่พร้อมจำหน่าย
            </h2>
            <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <p class="text-gray-400 text-sm">กำลังโหลดรายการสินค้า...</p>
            </div>
        </section>

        <!-- ฝั่งขวา: ระบบฝากเงิน - ถอนเงิน -->
        <section class="space-y-6">
            
            <!-- กล่องฝากเงิน -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <h3 class="text-md font-bold text-green-400 mb-3 flex items-center gap-2">
                    📥 ฝากเงิน (ยืนยันสลิป)
                </h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">จำนวนเงินที่โอน (บาท)</label>
                        <input type="number" id="depositAmount" placeholder="เช่น 100" 
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">รหัสสลิป / เลขที่รายการ</label>
                        <input type="text" id="slipCode" placeholder="เช่น SLIP98765" 
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-green-500">
                    </div>
                    <button onclick="depositMoney()" 
                        class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-lg transition text-sm shadow">
                        แจ้งฝากเงิน
                    </button>
                </div>
            </div>

            <!-- กล่องถอนเงิน -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <h3 class="text-md font-bold text-red-400 mb-3 flex items-center gap-2">
                    📤 แจ้งถอนเงิน
                </h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">จำนวนเงินที่ต้องการถอน</label>
                        <input type="number" id="withdrawAmount" placeholder="เช่น 50" 
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">เลขบัญชี / พร้อมเพย์</label>
                        <input type="text" id="bankAccount" placeholder="เช่น 0812345678" 
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <button onclick="withdrawMoney()" 
                        class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-lg transition text-sm shadow">
                        แจ้งถอนเงิน
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- สคริปต์ดึงและส่งข้อมูล API -->
    <script>
        // ดึงข้อมูลผู้ใช้
        async function loadUserData() {
            try {
                const res = await fetch('/api/user');
                const user = await res.json();
                if (user) {
                    document.getElementById('username').innerText = user.username;
                    document.getElementById('userBalance').innerText = Number(user.balance).toFixed(2);
                }
            } catch (err) {
                console.error("โหลดข้อมูลผู้ใช้ไม่สำเร็จ:", err);
            }
        }

        // ดึงรายการสินค้า
        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const container = document.getElementById('productList');
                container.innerHTML = '';

                if (!products || products.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm">ไม่มีสินค้าพร้อมจำหน่ายในขณะนี้</p>';
                    return;
                }

                products.forEach(p => {
                    container.innerHTML += `
                        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col justify-between hover:border-yellow-500 transition shadow">
                            <div>
                                <span class="bg-yellow-500/20 text-yellow-400 text-xs font-semibold px-2 py-0.5 rounded border border-yellow-500/30">
                                    ${p.game}
                                </span>
                                <h3 class="text-base font-bold mt-2 text-white">${p.name}</h3>
                                <p class="text-xs text-gray-400 mt-1 line-clamp-2">${p.details || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                            </div>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-700/50">
                                <span class="text-lg font-extrabold text-green-400">${Number(p.price).toFixed(2)} ฿</span>
                                <button class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                                    ซื้อเลย
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("โหลดสินค้าไม่สำเร็จ:", err);
            }
        }

        // แจ้งฝากเงิน
        async function depositMoney() {
            const amount = document.getElementById('depositAmount').value;
            const slipCode = document.getElementById('slipCode').value;

            if (!amount || !slipCode) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

            const res = await fetch('/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: Number(amount), slipCode })
            });

            const data = await res.json();
            alert(data.message);

            if (data.success) {
                document.getElementById('depositAmount').value = '';
                document.getElementById('slipCode').value = '';
                loadUserData();
            }
        }

        // แจ้งถอนเงิน
        async function withdrawMoney() {
            const amount = document.getElementById('withdrawAmount').value;
            const bankAccount = document.getElementById('bankAccount').value;

            if (!amount || !bankAccount) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

            const res = await fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: Number(amount), bankAccount })
            });

            const data = await res.json();
            alert(data.message);

            if (data.success) {
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('bankAccount').value = '';
                loadUserData();
            }
        }

        // เริ่มการทำงานเมื่อเปิดหน้าเว็บ
        loadUserData();
        loadProducts();
    </script>
</body>
</html>
